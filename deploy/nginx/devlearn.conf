# ==============================================================================
# ⚡ DevLearn Platform — Production Nginx Configuration
# Скопируйте файл в /etc/nginx/sites-available/devlearn.conf
# и сделайте симлинк: sudo ln -s /etc/nginx/sites-available/devlearn.conf /etc/nginx/sites-enabled/
# Проверка конфигурации: sudo nginx -t
# Перезагрузка Nginx: sudo systemctl reload nginx
# Получение бесплатного SSL (Let's Encrypt): sudo certbot --nginx -d devlearn.example.com
# ==============================================================================

upstream devlearn_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name devlearn.example.com; # Замените на ваш домен или IP-адрес

    # Редирект на HTTPS (активируется после настройки Certbot)
    # return 301 https://$host$request_uri;

    # Корневой каталог (если Nginx раздает статику напрямую)
    # root /var/www/dev_learn/mobile-app/dist;
    # index index.html;

    # Gzip-сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Базовые заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Кэширование статичных ассетов Expo Web и бандлов
    location ~* ^/(assets|_expo/static)/ {
        proxy_pass http://devlearn_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API и Web SPA маршруты
    location / {
        proxy_pass http://devlearn_backend;
        proxy_http_version 1.1;
        
        # Передача реального IP и протокола
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
